<!doctype html>
<html lang="zh-CN" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>科普讲解竖屏组件模板</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="styles/explainer.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: var(--font-sans);
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* 背景：浅灰白 + 细网格 */
      #bg {
        position: absolute;
        inset: 0;
        background-color: var(--bg);
        background-image:
          linear-gradient(var(--bg-grid) 2px, transparent 2px),
          linear-gradient(90deg, var(--bg-grid) 2px, transparent 2px);
        background-size: 72px 72px;
      }
      /* 账号标识：右上 */
      #brand-mark {
        position: absolute;
        top: 150px;
        right: var(--safe-x);
        font-size: 36px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qv3y"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="18.2"
    >
      <div data-hf-id="hf-endj" id="bg" class="clip" data-start="0" data-duration="18.2" data-track-index="0"></div>

      <div data-hf-id="hf-c61f"
        id="chapter-card"
        data-composition-id="chapter-card"
        data-composition-src="compositions/chapter-card.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div data-hf-id="hf-blbl"
        id="arch-diagram"
        data-composition-id="arch-diagram"
        data-composition-src="compositions/arch-diagram.html"
        data-start="3"
        data-duration="5"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>
      <div data-hf-id="hf-wzqm"
        id="typing-compare"
        data-composition-id="typing-compare"
        data-composition-src="compositions/typing-compare.html"
        data-start="8"
        data-duration="3"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>
      <div data-hf-id="hf-aeuq"
        id="screen-window"
        data-composition-id="screen-window"
        data-composition-src="compositions/screen-window.html"
        data-start="11"
        data-duration="4"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="outro-follow"
        data-composition-id="outro-follow"
        data-composition-src="compositions/outro-follow.html"
        data-start="15"
        data-duration="3.2"
        data-track-index="5"
        data-width="1080"
        data-height="1920"
      ></div>

      <div data-hf-id="hf-covz" id="brand-mark" class="clip" data-start="0" data-duration="15" data-track-index="9">@牛同学不上班</div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
