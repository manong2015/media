<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>结尾关注卡</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="../styles/explainer.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          font-family: var(--font-sans);
          color: var(--ink);
        }
        /* 角色视频卡：源视频 960×960，浅灰棚拍底与 --bg 接近 */
        #of-card {
          position: absolute;
          left: 120px;
          top: 280px;
          width: 840px;
          height: 840px;
          border-radius: 40px;
          overflow: hidden;
          background: var(--surface);
          box-shadow: 0 24px 64px rgba(11, 27, 63, 0.16);
          border: 6px solid var(--surface);
        }
        #of-video,
        #of-hold {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #of-text {
          position: absolute;
          left: var(--safe-x);
          right: var(--safe-x);
          top: 1170px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 28px;
        }
        #of-follow {
          display: flex;
          align-items: center;
          gap: 16px;
          background: var(--primary);
          color: #ffffff;
          border-radius: 999px;
          padding: 18px 56px;
          font-size: 64px;
          font-weight: 900;
        }
        #of-plus {
          font-family: var(--font-mono);
          font-weight: 800;
        }
        #of-handle {
          font-size: 96px;
          font-weight: 900;
          color: var(--ink);
          white-space: nowrap;
        }
      </style>

      <div id="root" data-composition-id="outro-follow" data-width="1080" data-height="1920">
        <div id="of-card">
          <!-- 竖大拇指 + 眨眼 + 双拳（源片 3.917–5.04s，已去音轨），播完停在最后一帧 -->
          <video id="of-video" class="clip" src="../assets/videos/niu-thumbsup-outro.mp4" muted playsinline data-start="0" data-duration="1.125" data-track-index="0"></video>
          <img id="of-hold" class="clip" src="../assets/images/niu-thumbsup-outro-last.png" alt="牛同学" data-start="1.125" data-duration="2.075" data-track-index="1" />
        </div>
        <div id="of-text">
          <div id="of-follow"><span id="of-plus">+</span><span>关注</span></div>
          <div id="of-handle">@牛同学不上班</div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#of-card", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
        tl.fromTo("#of-follow", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }, 0.35);
        tl.fromTo("#of-handle", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.5);
        tl.to("#of-follow", { scale: 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 1.4);
        window.__timelines["outro-follow"] = tl;
      </script>
    </template>
  </body>
</html>
