<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>关键词打字 + 对比卡</title>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="../styles/explainer.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          font-family: var(--font-sans);
          color: var(--ink);
        }
        #tc-code {
          position: absolute;
          left: var(--safe-x);
          right: var(--safe-right);
          top: 320px;
          display: flex;
          flex-direction: column;
          gap: 28px;
          font-family: var(--font-mono);
          font-size: 80px;
          font-weight: 800;
        }
        .tc-line {
          display: flex;
          align-items: center;
          white-space: nowrap;
          height: 100px;
        }
        .tc-ch {
          opacity: 0;
        }
        .tc-kw {
          color: var(--accent);
        }
        #tc-cursor {
          width: 8px;
          height: 88px;
          margin-left: 6px;
          background: var(--accent);
          opacity: 0;
        }
        #tc-compare {
          position: absolute;
          left: var(--safe-x);
          width: 864px;
          top: 660px;
          display: flex;
          flex-direction: column;
          gap: 28px;
        }
        .tc-card {
          border-radius: 24px;
          padding: 36px 40px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .tc-tag {
          font-size: 36px;
          font-weight: 700;
        }
        .tc-text {
          font-size: 56px;
          font-weight: 800;
        }
        #tc-old {
          background: var(--surface);
          border: 4px dashed var(--muted);
          color: var(--muted);
        }
        #tc-new {
          background: var(--primary);
          color: #ffffff;
        }
      </style>

      <div data-hf-id="hf-selm" id="root" data-composition-id="typing-compare" data-width="1080" data-height="1920">
        <div data-hf-id="hf-1jy8" id="tc-code">
          <div data-hf-id="hf-z8mh" id="tc-l1" class="tc-line"></div>
          <div data-hf-id="hf-5eca" id="tc-l2" class="tc-line"><div data-hf-id="hf-zsnl" id="tc-cursor"></div></div>
        </div>
        <div data-hf-id="hf-s6ww" id="tc-compare">
          <div data-hf-id="hf-8anj" id="tc-old" class="tc-card">
            <div data-hf-id="hf-kkfq" class="tc-tag">以前</div>
            <div data-hf-id="hf-xequ" class="tc-text">手动复制粘贴给 AI</div>
          </div>
          <div data-hf-id="hf-fy96" id="tc-new" class="tc-card">
            <div data-hf-id="hf-2cx4" class="tc-tag">现在</div>
            <div data-hf-id="hf-ina3" class="tc-text">AI 自己去读文件</div>
          </div>
        </div>
        <div data-hf-id="hf-nnc6" class="ex-sub"><div data-hf-id="hf-qe1f" id="tc-sub" class="ex-sub-box">省掉的是你<em data-hf-id="hf-w5dw">来回搬运</em></div></div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // 每行由 [文字, 是否高亮] 片段组成，逐字出现
        const lines = [
          { el: "#tc-l1", parts: [["mcp ", false], ["list-tools", true]] },
          { el: "#tc-l2", parts: [["mcp ", false], ["read_file", true]] },
        ];
        const cursor = document.querySelector("#tc-cursor");
        let t = 0.15;
        lines.forEach(({ el, parts }) => {
          const host = document.querySelector(el);
          parts.forEach(([text, kw]) => {
            [...text].forEach((c) => {
              const span = document.createElement("span");
              span.className = kw ? "tc-ch tc-kw" : "tc-ch";
              span.textContent = c === " " ? " " : c;
              host.insertBefore(span, host.contains(cursor) ? cursor : null);
              tl.set(span, { opacity: 1 }, t);
              t += 0.045;
            });
          });
          t += 0.12;
        });
        tl.set("#tc-cursor", { opacity: 1 }, 0.15);
        tl.to("#tc-cursor", { opacity: 0, duration: 0.01, repeat: 5, yoyo: true, repeatDelay: 0.25 }, t);
        tl.fromTo("#tc-sub", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
        tl.fromTo("#tc-old", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.0);
        tl.fromTo("#tc-new", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.3);
        window.__timelines["typing-compare"] = tl;
      </script>
    </template>
  </body>
</html>
